<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akash Relatórios</title>
<link rel="icon" type="image/svg+xml" href="akash-mark.svg">
<link rel="stylesheet" href="report.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <img src="akash-relatorios-logo.svg" alt="Akash Relatórios" height="36">
  <span class="hint">Arraste o export do Gerenciador de Anúncios (.xlsx ou .csv). Um arquivo por cliente.</span>
</header>
<main class="layout">
  <aside class="side">
    <label class="drop" id="drop">
      <input type="file" id="file" accept=".xlsx,.xls,.csv" multiple hidden>
      <strong>Solte as planilhas aqui</strong><span>ou clique para escolher (pode vários)</span>
    </label>
    <div id="metaPanel" class="mpanel" hidden>
      <strong>Puxar da Meta</strong>
      <div class="row2"><label class="f">De<input type="date" id="mIni"></label><label class="f">Até<input type="date" id="mFim"></label></div>
      <button class="btn small" id="mTodos" type="button">Marcar / desmarcar todos</button>
      <div id="mLista" class="mlista"></div>
      <button class="btn primary" id="mPuxar" type="button">Puxar e montar relatórios</button>
    </div>
    <ul id="clients" class="clients"></ul>
    <div class="bulk">
      <label>Resolução
        <select id="scale"><option value="1">1920 x 1080</option><option value="2">3840 x 2160</option></select>
      </label>
      <button id="zip" class="btn" disabled>Baixar todos (.zip)</button>
    </div>
  </aside>

  <section class="editor" id="editor">
    <p class="empty">Nenhum cliente carregado ainda.</p>
  </section>

  <section class="preview">
    <div class="actions">
      <button id="png" class="btn primary" disabled>Baixar PNG</button>
      <button id="copy" class="btn" disabled>Copiar imagem</button>
      <button id="drive" class="btn" disabled hidden>Enviar ao Drive</button>
      <label class="small" id="driveTodosL" hidden><input type="checkbox" id="driveTodos" checked> todos</label>
      <a id="driveLink" class="small" target="_blank" hidden>abrir pasta</a>
      <button id="save" class="btn" disabled title="Guarda grupos, papéis e opções deste cliente para as próximas semanas">Salvar config do cliente</button>
      <span id="status" class="status"></span>
    </div>
    <div class="stagewrap" id="stagewrap"><div class="stage" id="stage"></div></div>
  </section>
</main>
<div id="login" class="login" hidden>
  <div class="box"><img src="akash-relatorios-logo.svg" alt="Akash Relatórios" height="36">
    <p>Digite a senha para continuar.</p>
    <input type="password" id="senha" autocomplete="current-password" placeholder="Senha">
    <button class="btn primary" id="loginBtn" type="button">Entrar</button>
    <span id="loginErr" class="status"></span></div>
</div>
<div id="export" style="position:fixed;left:-10000px;top:0"></div>

<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="vendor/html-to-image.js"></script>
<script src="core.js"></script>
<script src="report.js"></script>
<script src="app.js"></script>
</body>
</html>
